services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mtb_galaxy
      POSTGRES_USER: mtb
      POSTGRES_PASSWORD: mtb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtb -d mtb_galaxy"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
