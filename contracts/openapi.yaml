openapi: 3.1.0
info:
  title: MTB Galaxy API
  version: 1.0.0
paths:
  /v1/auth/request-otp:
    post:
      tags:
      - auth
      summary: Request Otp
      operationId: request_otp_v1_auth_request_otp_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOtpRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestOtpResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/verify-otp:
    post:
      tags:
      - auth
      summary: Verify Otp
      operationId: verify_otp_v1_auth_verify_otp_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh Tokens
      operationId: refresh_tokens_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/LogoutRequest'
              - type: 'null'
              title: Payload
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/users:
    post:
      tags:
      - users
      summary: Create User
      operationId: create_user_v1_users_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserByNicknameRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserByNicknameResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - users
      summary: Get User By Nickname
      operationId: get_user_by_nickname_v1_users_get
      parameters:
      - name: nickname
        in: query
        required: true
        schema:
          type: string
          title: Nickname
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserByNicknameResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/me:
    get:
      tags:
      - users
      summary: Get Me
      operationId: get_me_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
      security:
      - HTTPBearer: []
  /v1/friends:
    post:
      tags:
      - friends
      summary: Create Friendship
      operationId: create_friendship_v1_friends_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendAddRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleSuccessResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/friends/{user_id}:
    get:
      tags:
      - friends
      summary: Get Friends
      operationId: get_friends_v1_friends__user_id__get
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FriendEntryOut'
                title: Response Get Friends V1 Friends  User Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/play-together:
    post:
      tags:
      - friends
      summary: Create Play Together
      operationId: create_play_together_v1_play_together_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayTogetherRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayTogetherResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/payment-requests:
    post:
      tags:
      - payment-requests
      summary: Create Payment Request Endpoint
      operationId: create_payment_request_endpoint_v1_payment_requests_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequestCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequestCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/payment-requests/{request_id}:
    get:
      tags:
      - payment-requests
      summary: Get Payment Request Endpoint
      operationId: get_payment_request_endpoint_v1_payment_requests__request_id__get
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequestOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/payment-requests/{request_id}/pay:
    post:
      tags:
      - payment-requests
      summary: Pay Payment Request Endpoint
      operationId: pay_payment_request_endpoint_v1_payment_requests__request_id__pay_post
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequestPayResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/profile:
    get:
      tags:
      - profile
      summary: Get Profile
      operationId: get_profile_v1_profile_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalaxyProfileResponse'
      security:
      - HTTPBearer: []
  /v1/profile/focus-planet:
    patch:
      tags:
      - profile
      summary: Set Focus Planet
      operationId: set_focus_planet_v1_profile_focus_planet_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modules__profile__schemas__FocusPlanetRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalaxyProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/promocodes:
    get:
      tags:
      - promocodes
      summary: Get Promocodes
      operationId: get_promocodes_v1_promocodes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PromoCodeOut'
                type: array
                title: Response Get Promocodes V1 Promocodes Get
      security:
      - HTTPBearer: []
  /v1/planets/list:
    get:
      tags:
      - planets
      summary: Get Planets
      operationId: get_planets_v1_planets_list_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PlanetListItemOut'
                type: array
                title: Response Get Planets V1 Planets List Get
      security:
      - HTTPBearer: []
  /v1/planets/{planet_id}/progress:
    get:
      tags:
      - planets
      summary: Get Planet Progress
      operationId: get_planet_progress_v1_planets__planet_id__progress_get
      security:
      - HTTPBearer: []
      parameters:
      - name: planet_id
        in: path
        required: true
        schema:
          type: string
          title: Planet Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modules__planets__schemas__PlanetProgressOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/planets/{planet_id}/focus:
    patch:
      tags:
      - planets
      summary: Focus Planet
      operationId: focus_planet_v1_planets__planet_id__focus_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: planet_id
        in: path
        required: true
        schema:
          type: string
          title: Planet Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modules__planets__schemas__FocusPlanetRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusPlanetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/quests:
    get:
      tags:
      - quests
      summary: Get Quests
      operationId: get_quests_v1_quests_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/QuestOut'
                type: array
                title: Response Get Quests V1 Quests Get
      security:
      - HTTPBearer: []
  /v1/quests/{quest_id}/claim:
    post:
      tags:
      - quests
      summary: Claim Quest
      operationId: claim_quest_v1_quests__quest_id__claim_post
      security:
      - HTTPBearer: []
      parameters:
      - name: quest_id
        in: path
        required: true
        schema:
          type: string
          title: Quest Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/rewards/ledger:
    get:
      tags:
      - rewards
      summary: Get Reward Ledger
      operationId: get_reward_ledger_v1_rewards_ledger_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RewardOut'
                type: array
                title: Response Get Reward Ledger V1 Rewards Ledger Get
      security:
      - HTTPBearer: []
  /v1/referrals:
    get:
      tags:
      - referrals
      summary: Get Referrals
      operationId: get_referrals_v1_referrals_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralListResponse'
      security:
      - HTTPBearer: []
    post:
      tags:
      - referrals
      summary: Create Referral Invite
      operationId: create_referral_invite_v1_referrals_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferralCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/games/{game_code}/runs:
    post:
      tags:
      - games
      summary: Create Game Run
      operationId: create_game_run_v1_games__game_code__runs_post
      security:
      - HTTPBearer: []
      parameters:
      - name: game_code
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GameCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameRunSubmitRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameRunOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/games/summary:
    get:
      tags:
      - games
      summary: Game Summary
      operationId: game_summary_v1_games_summary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSummaryOut'
      security:
      - HTTPBearer: []
  /v1/leaderboard:
    get:
      tags:
      - leaderboard
      summary: Leaderboard
      operationId: leaderboard_v1_leaderboard_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LeaderboardEntryOut'
                type: array
                title: Response Leaderboard V1 Leaderboard Get
      security:
      - HTTPBearer: []
  /v1/leaderboard/planet/{planet_id}:
    get:
      tags:
      - leaderboard
      summary: Planet Leaderboard
      operationId: planet_leaderboard_v1_leaderboard_planet__planet_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: planet_id
        in: path
        required: true
        schema:
          type: string
          title: Planet Id
      - name: period
        in: query
        required: false
        schema:
          type: string
          default: week
          title: Period
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanetLeaderboardOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/transactions/webhook:
    post:
      tags:
      - transactions
      summary: Transaction Webhook
      operationId: transaction_webhook_v1_transactions_webhook_post
      parameters:
      - name: x-internal-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Internal-Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionWebhookRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionWebhookResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/end_period:
    post:
      tags:
      - admin
      summary: End Period Endpoint
      operationId: end_period_endpoint_v1_admin_end_period_post
      parameters:
      - name: x-internal-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Internal-Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndPeriodResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ActivityOut:
      properties:
        activity_id:
          type: string
          title: Activity Id
        title:
          type: string
          title: Title
        detail:
          type: string
          title: Detail
        reward:
          type: integer
          title: Reward
        planet_code:
          anyOf:
          - $ref: '#/components/schemas/PlanetCode'
          - type: 'null'
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - activity_id
      - title
      - detail
      - reward
      - planet_code
      - created_at
      title: ActivityOut
    AuthLoginResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        expires_in_seconds:
          type: integer
          title: Expires In Seconds
        user:
          $ref: '#/components/schemas/UserSummaryOut'
        me:
          $ref: '#/components/schemas/MeResponse'
      type: object
      required:
      - access_token
      - refresh_token
      - expires_in_seconds
      - user
      - me
      title: AuthLoginResponse
    AuthTokensResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        expires_in_seconds:
          type: integer
          title: Expires In Seconds
      type: object
      required:
      - access_token
      - refresh_token
      - expires_in_seconds
      title: AuthTokensResponse
    BoosterWindowOut:
      properties:
        booster_id:
          type: string
          title: Booster Id
        category:
          type: string
          title: Category
        boost_rate:
          type: number
          title: Boost Rate
        start_at:
          type: string
          format: date-time
          title: Start At
        end_at:
          type: string
          format: date-time
          title: End At
        status:
          type: string
          title: Status
      type: object
      required:
      - booster_id
      - category
      - boost_rate
      - start_at
      - end_at
      - status
      title: BoosterWindowOut
    ConstellationCode:
      type: string
      enum:
      - CASHBACK_COMET
      - TRUST_ANCHOR
      - COMMUNITY_NOVA
      title: ConstellationCode
    EndPeriodPlanetOut:
      properties:
        planet_id:
          type: string
          title: Planet Id
        winners:
          type: integer
          title: Winners
        period_id:
          type: string
          title: Period Id
      type: object
      required:
      - planet_id
      - winners
      - period_id
      title: EndPeriodPlanetOut
    EndPeriodResponse:
      properties:
        status:
          type: string
          title: Status
        period_type:
          type: string
          title: Period Type
        planets:
          items:
            $ref: '#/components/schemas/EndPeriodPlanetOut'
          type: array
          title: Planets
      type: object
      required:
      - status
      - period_type
      - planets
      title: EndPeriodResponse
    FocusPlanetResponse:
      properties:
        planet_id:
          type: string
          title: Planet Id
        focus:
          type: boolean
          title: Focus
      type: object
      required:
      - planet_id
      - focus
      title: FocusPlanetResponse
    FriendAddRequest:
      properties:
        user_id:
          type: string
          title: User Id
        friend_id:
          type: string
          title: Friend Id
      type: object
      required:
      - user_id
      - friend_id
      title: FriendAddRequest
    FriendEntryOut:
      properties:
        id:
          type: string
          title: Id
        nickname:
          type: string
          title: Nickname
        games_played:
          type: integer
          title: Games Played
      type: object
      required:
      - id
      - nickname
      - games_played
      title: FriendEntryOut
    GalaxyProfileResponse:
      properties:
        user:
          $ref: '#/components/schemas/UserSummaryOut'
        orbit_level:
          type: integer
          title: Orbit Level
        total_energy:
          type: integer
          title: Total Energy
        total_xp:
          type: integer
          title: Total Xp
        stardust:
          type: integer
          title: Stardust
        bonus_streak:
          type: integer
          title: Bonus Streak
        vault_charge:
          type: integer
          title: Vault Charge
        vault_crates:
          type: integer
          title: Vault Crates
        selected_planet:
          $ref: '#/components/schemas/PlanetCode'
        rating:
          $ref: '#/components/schemas/RatingOverviewOut'
        wallet:
          $ref: '#/components/schemas/WalletOut'
        quest_summary:
          $ref: '#/components/schemas/QuestSummaryOut'
        constellations:
          items:
            $ref: '#/components/schemas/modules__profile__schemas__ConstellationOut'
          type: array
          title: Constellations
        planets:
          items:
            $ref: '#/components/schemas/modules__profile__schemas__PlanetProgressOut'
          type: array
          title: Planets
        active_boosters:
          items:
            $ref: '#/components/schemas/BoosterWindowOut'
          type: array
          title: Active Boosters
        quests:
          items:
            $ref: '#/components/schemas/QuestOut'
          type: array
          title: Quests
        reward_ledger_preview:
          items:
            $ref: '#/components/schemas/RewardOut'
          type: array
          title: Reward Ledger Preview
        activity:
          items:
            $ref: '#/components/schemas/ActivityOut'
          type: array
          title: Activity
        installment_profile:
          $ref: '#/components/schemas/InstallmentProfileOut'
      type: object
      required:
      - user
      - orbit_level
      - total_energy
      - total_xp
      - stardust
      - bonus_streak
      - vault_charge
      - vault_crates
      - selected_planet
      - rating
      - wallet
      - quest_summary
      - constellations
      - planets
      - active_boosters
      - quests
      - reward_ledger_preview
      - activity
      - installment_profile
      title: GalaxyProfileResponse
    GameCode:
      type: string
      enum:
      - halva_snake
      - credit_shield_reactor
      - social_ring_signal
      title: GameCode
    GameRunOut:
      properties:
        run_id:
          type: string
          title: Run Id
        game_code:
          $ref: '#/components/schemas/GameCode'
        planet_code:
          $ref: '#/components/schemas/PlanetCode'
        score:
          type: integer
          title: Score
        base_reward:
          type: integer
          title: Base Reward
        total_reward:
          type: integer
          title: Total Reward
        bonus_breakdown:
          additionalProperties: true
          type: object
          title: Bonus Breakdown
        small_star_awarded:
          type: boolean
          title: Small Star Awarded
